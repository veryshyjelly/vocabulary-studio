21315},{"lang":"en","word":"accord","synsetid":36539,"example":{"text":"A fourth said the draft accord was already ready and waiting to be signed.\nReuters (Jul 25, 2013)","offsets":[24,30]},"l":true,"definition":"a written agreement between two states or sovereigns","shortdefinition":"a written agreement between two states or sovereigns","audio":["A/1Q9XTDE6JH6C7"],"ffreq":0.041781034,"learnable":true,"difficulty":610,"diff":3.5307734},{"lang":"en","word":"acerbic","synsetid":105781,"example":{"text":"But the risk, of course, was that an acerbic confrontation could turn off the very swing voters he covets.\n New York Times (Oct 17, 2012)","offsets":[37,44]},"l":true,"definition":"harsh or corrosive in tone","shortdefinition":"harsh or corrosive in tone","audio":["A/12Z7X30B07JMA"],"ffreq":4.5095694E-5,"learnable":true,"difficulty":590,"diff":3.0668044},{"lang":"en","word":"adaptive","example":{"text":"And though they were not physically more robust, they reported less difficulty in getting around, possibly because of better adaptive equipment.\nNew York Times (Jul 17, 2013)","offsets":[125,133]},"l":true,"definition":"having a capacity for adaptation","shortdefinition":"having a capacity for change","audio":["A/14VKTDT75SQAV"],"ffreq":7.682343E-5,"learnable":true,"difficulty":360,"diff":-4.528333},{"lang":"en","word":"adequate","example":{"text":"Silicosis, which has no known cure, is contracted by inhaling tiny particles of silica dust from gold-bearing rocks over many years underground without adequate protection.\nReuters (Jul 24, 2013)","offsets":[152,160]},"l":true,"definition":"having the requisite qualities or resources to meet a task","shortdefinition":"having the requisite qualities or resources to meet a task","audio":["A/1UDWZ7VF71IOO"],"ffreq":0.004600776,"learnable":true,"difficulty":500,"diff":0.07178571},{"lang":"en","word":"adjacent","synsetid":99040,"example":{"text":"The games, held over four days, were set to take place in the United Center and on its adjacent parking lots.\nChicago Tribune (Jul 17, 2013)","offsets":[87,95]},"l":true,"definition":"having a common boundary or edge; abutting; touching","shortdefinition":"having a common boundary or edge","audio":["A/YFQNHI2QK53M"],"ffreq":0.0013679309,"learnable":true,"difficulty":470,"diff":-0.88253343},{"lang":"en","word":"admonish","synsetid":86318,"example":{"text":"Unlike Singapore, Malaysia has not publicly admonished Indonesia over the smog.\nReuters (Jun 27, 2013)","offsets":[44,54]},"l":true,"definition":"warn strongly; put on guard","shortdefinition":"warn strongly; put on guard","audio":["A/CQLDTUIIG0KQ"],"ffreq":0.001534438,"learnable":true,"difficulty":590,"diff":2.937158},{"lang":"en","word":"adverse","synsetid":101339,"example":{"text":"Men given the drug also experienced fewer adverse effects, like bone pain and muscle weakness.\nNew York Times (Jul 17, 2013)","offsets":[42,49]},"l":true,"definition":"contrary to your interests or welfare","shortdefinition":"contrary to your interests or welfare","audio":["A/V2EFX4OL7STM"],"ffreq":0.0018139806,"learnable":true,"difficulty":550,"diff":1.7959616},{"lang":"en","word":"aesthetics","example":{"text":"Aesthetics and ethics are related in complex ways, which make art less comforting than the art market would have us think.\nThe Guardian (Jun 8, 2013)","offsets":[0,10]},"l":true,"definition":"(art) the branch of philosophy dealing with beauty and taste (emphasizing the evaluative criteria that are applied to art)","shortdefinition":"the branch of philosophy dealing with beauty and taste","audio":["A/16YZ99JDNWY1O"],"ffreq":1.457784E-4,"learnable":true,"difficulty":550,"diff":1.8075},{"lang":"en","word":"affable","example":{"text":"Like many selfish men, he could be good-natured so long as affability was cheap.\n Lewis Wingfield","offsets":[]},"l":true,"definition":"diffusing warmth and friendliness","shortdefinition":"diffusing warmth and friendliness","audio":["A/9W0ZMGAJX0N"],"ffreq":7.9429336E-4,"learnable":true,"difficulty":570,"diff":2.4954174},{"lang":"en","word":"affect","synsetid":82745,"example":{"text":"My point is that the inequality affects growth through many channels.\nNew York Times (Jul 26, 2013)","offsets":[32,39]},"l":true,"definition":"have an effect upon","shortdefinition":"have an influence upon","audio":["A/19VVJXFMFOSHH","A/R29NX17ZI212"],"ffreq":0.0149798915,"learnable":true,"difficulty":550,"diff":1.5016376},{"lang":"en","word":"aloof","example":{"text":"But in a place filled with so many big personalities, Goodlatte can come across as aloof, boring or uninterested.\nWashington Post (Jul 23, 2013)","offsets":[83,88]},"l":true,"definition":"remote in manner","shortdefinition":"distant, cold, or detached in manner","audio":["A/KEPYU9DD3XYQ"],"ffreq":0.0012155531,"learnable":true,"difficulty":570,"diff":2.4309378},{"lang":"en","word":"ambiguity","example":{"text":"There\u2019s enough ambiguity that you could argue a given case in many different ways.\nSlate (Jul 1, 2013)","offsets":[15,24]},"l":true,"definition":"unclearness by virtue of having more than one meaning","shortdefinition":"unclearness by virtue of having more than one meaning","audio":["A/1RO488196VSIY"],"ffreq":3.233691E-4,"learnable":true,"difficulty":550,"diff":1.6597562},{"lang":"en","word":"ameliorate","synsetid":83090,"example":{"text":"There are job-creation programs and low-cost housing, but nothing has fully ameliorated the lingering injustices.\nNew York Times (May 7, 2013)","offsets":[76,87]},"l":true,"definition":"make better","shortdefinition":"make better","audio":["A/15AJ0ORQ5BQYK"],"ffreq":3.547584E-4,"learnable":true,"difficulty":590,"diff":3.0648842},{"lang":"en","word":"ample","example":{"text":"Mr. Saatchi\u2019s public comments, though, have provided ample ammunition for detractors.\nNew York Times (Jul 5, 2013)","offsets":[53,58]},"l":true,"definition":"more than enough in size or scope or capacity","shortdefinition":"more than enough in size or scope or capacity","audio":["A/FZQ739LD1UKY"],"ffreq":0.0039874576,"learnable":true,"difficulty":530,"diff":1.0423683},{"lang":"en","word":"anachronistic","example":{"text":"Net metering are only symptoms of this more fundamental disconnect between emerging market forces and an anachronistic model used to regulate those market forces.\nForbes (Jul 16, 2013)","offsets":[105,118]},"l":true,"definition":"chronologically misplaced","shortdefinition":"chronologically misplaced","audio":["A/1X23LHXOIICEJ"],"ffreq":5.397946E-5,"learnable":true,"difficulty":570,"diff":2.4533334},{"lang":"en","word":"analogous","example":{"text":"Section 230 does not apply to cases involving intellectual property, federal criminal prosecutions, and violations of the Electronic Communications Privacy Act or analogous state laws.\n Forbes (Jun 26, 2013)","offsets":[163,172]},"l":true,"definition":"similar or equivalent in some respects though otherwise dissimilar","shortdefinition":"similar or equivalent in some respects","audio":["A/1UTR3ZGK9SOUV"],"ffreq":7.866787E-4,"learnable":true,"difficulty":540,"diff":1.447174},{"lang":"en","word":"anomaly","example":{"text":"So some researchers have searched for signs of family relationships in the skeletons themselves, looking for rare anomalies that might suggest shared genetic heritage.\nScience Magazine (Jun 19, 2013)","offsets":[114,123]},"l":true,"definition":"deviation from the normal or common order or form or rule","shortdefinition":"deviation from the normal or common order, form, or rule","audio":["A/LWCIPH1QMAV3"],"ffreq":7.259306E-4,"learnable":true,"difficulty":510,"diff":0.493647},{"lang":"en","word":"antedate","example":{"text":"Much about Lee whose missionary labors antedated Marcus Whitman''s by two years.\nVarious","offsets":[39,48]},"definition":"be earlier in time; go back further","shortdefinition":"be earlier in time than","audio":["A/1TSU33K1DSJ1Y"],"ffreq":1.0982028E-4,"learnable":true,"difficulty":570,"diff":2.41},{"lang":"en","word":"antithetical","synsetid":107208,"example":{"text":"Looking at the clock leads to two things antithetical to sleep, Grandner says \u2014 math and worry.\nWashington Post (Jun 10, 2013)","offsets":[41,53]},"l":true,"definition":"sharply contrasted in character or purpose","shortdefinition":"sharply contrasted in character or purpose","audio":["A/71DKO7QUFZCP"],"ffreq":4.7803125E-5,"learnable":true,"difficulty":600,"diff":3.2058337},{"lang":"en","word":"apathy","example":{"text":"Commencement speakers now and then worried about apathy born of cynicism and crisis fatigue.\nNew York Times (Jun 15, 2013)","offsets":[49,55]},"l":true,"definition":"an absence of emotion or enthusiasm","shortdefinition":"an absence of emotion or enthusiasm","audio":["A/8SJPDY62BWDJ"],"ffreq":8.40489E-4,"learnable":true,"difficulty":550,"diff":1.7645458},{"lang":"en","word":"apparent","example":{"text":"In other words, just as we know, funding journalism over the coming decades remains a large headache without apparent easy solution.\nThe Guardian (Jul 26, 2013)","offsets":[109,117]},"l":true,"definition":"clearly revealed to the mind or the senses or judgment","shortdefinition":"clearly revealed to the mind or the senses or judgment","audio":["A/1IRPVIKEBBJ94"],"ffreq":0.017968815,"learnable":true,"difficulty":470,"diff":-0.88559324},{"lang":"en","word":"arbitrary","synsetid":99863,"example":{"text":"The National Human Rights Commission said it had credible reports of killings, torture, rape and arbitrary detention by security forces.\nReuters (Jul 3, 2013)","offsets":[97,106]},"l":true,"definition":"based on or subject to individual discretion or preference or sometimes impulse or caprice","shortdefinition":"based on or subject to individual discretion or preference","audio":["A/1E5IS5FKILOZ2"],"ffreq":0.001672771,"learnable":true,"difficulty":610,"diff":3.5434778},{"lang":"en","word":"arduous","example":{"text":"A few days later, riders face three straight days of arduous climbing in the high Alps.\nSeattle Times (Jul 8, 2013)","offsets":[53,60]},"l":true,"definition":"characterized by effort to the point of exhaustion; especially physical effort","shortdefinition":"characterized by effort to the point of exhaustion","audio":["A/13K0TISRH80L8"],"ffreq":8.0334634E-4,"learnable":true,"difficulty":560,"diff":1.9793005},{"lang":"en","word":"ascertain","example":{"text":"Still, a prospective employer has a hard time ascertaining which candidate is best prepared for the highly specific job at hand.\nForbes (Feb 27, 2013)","offsets":[46,58]},"l":true,"definition":"learn or discover with certainty","shortdefinition":"learn or discover with confidence","audio":["A/1N5LYF5M0TM9Q"],"ffreq":0.0044005103,"learnable":true,"difficulty":560,"diff":1.9605132},{"lang":"en","word":"assent","example":{"text":"\"Yes, yes,\u2014just so; of course,\" said Barrington, hurriedly assenting to he knew not what.\n Charles James Lever","offsets":[59,68]},"l":true,"definition":"agree or express agreement","shortdefinition":"agree or express agreement","audio":["A/NCHZQ0GZHQM0"],"ffreq":0.003384546,"learnable":true,"difficulty":600,"diff":3.4994447},{"lang":"en","word":"astounding","example":{"text":"Astoundingly, Wasserman Media represented the No. 1 overall draft pick last year in five professional sports: men\u2019s and women\u2019s basketball, baseball, soccer and football.\nNew York Times (Jul 6, 2013)","offsets":[0,12]},"l":true,"definition":"bewildering or striking dumb with wonder","shortdefinition":"bewildering or striking dumb with wonder","audio":["A/18CNTZBDBYV50"],"ffreq":7.3447597E-4,"learnable":true,"difficulty":410,"diff":-2.8340003},{"lang":"en","word":"attenuate","example":{"text":"At too low a dose, the therapeutic effects of the drug are attenuated. \nScientific American (Feb 4, 2013)","offsets":[59,69]},"l":true,"definition":"become weaker, in strength, value, or magnitude","shortdefinition":"become weaker, in strength, value, or magnitude","audio":["A/CQV4953Z6WL3"],"ffreq":2.9502567E-4,"learnable":true,"difficulty":590,"diff":3.0670002},{"lang":"en","word":"austerity","example":{"text":"Unemployment and austerity measures have curbed consumer spending.\nBBC (Jul 25, 2013)","offsets":[17,26]},"l":true,"definition":"excessive sternness","shortdefinition":"excessive sternness","audio":["A/1I8O4DTG950UZ"],"ffreq":8.520802E-4,"learnable":true,"difficulty":620,"diff":4.0473404}],"learners":19514,"owner":false,"vocabcom":true,"unlearnable":0}}'
